<script type="module">
import init, * as bindings from './solidcraft-web-4b1d77a936edaef2.js';
const wasm = await init({ module_or_path: await (async () => {
  const parts = ["./wasm/solidcraft-web-4b1d77a936edaef2_bg.part0.bin", "./wasm/solidcraft-web-4b1d77a936edaef2_bg.part1.bin", "./wasm/solidcraft-web-4b1d77a936edaef2_bg.part2.bin", "./wasm/solidcraft-web-4b1d77a936edaef2_bg.part3.bin", "./wasm/solidcraft-web-4b1d77a936edaef2_bg.part4.bin"];
  const blobs = await Promise.all(parts.map(async (u) => {
    const r = await fetch(u);
    if (!r.ok) throw new Error(u + ': HTTP ' + r.status);
    return r.blob();
  }));
  return new Response(new Blob(blobs, { type: 'application/wasm' }), { headers: { 'Content-Type': 'application/wasm' } });
})() });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Loading SolidCraft&hellip;</span></div>
  <script>
    // Offline use and updates (sw.js; written into release builds by `cargo xtask web-offline`).
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // Install as an app: the browser's offer can come before the app runs, so it is kept here for
    // the app's File ▸ Install app… item (src/install.rs). Installed, the browser makes no more offers.
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });
  </script>
