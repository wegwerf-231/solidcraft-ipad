name: Distribution checks
on:
  push:
    branches: [main, 'chore/**', 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check generated metadata and bundled notices
        run: python3 scripts/release.py check
      - name: Check JavaScript syntax
        run: |
          node --check touch-nav.js
          node --check project-version.js
          node --check sw.js
          node --check sketch-tools.js
          node --check sketch-tools-view.js
          node --test tests/*.test.cjs
      - name: Verify offline inventory and release packaging regressions
        run: python3 -m unittest discover -s tests -v
